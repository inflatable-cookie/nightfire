[catalog]
alias = "nightfire"

[manifest]
minimum_effigy_version = "0.12.1"

[package_manager]
js = "bun"

[release]
version-file = "package.json"
version-path = "version"
changelog = "CHANGELOG.md"
tag-format = "v{version}"
pre-1-0 = true
initial-tag-current-version = true

[release.gates]
qa = "effigy qa"

[release.gates.headless]
command = "effigy release:npm-certificate"
description = "Pack once and certify the npm archive set with its candidate identity manifest"

[bootstrap]
setup = ["bootstrap:deps"]

[tasks]
"bootstrap:deps" = "cd {repo} && bun install --frozen-lockfile"
"release:npm-admission" = "cd {repo} && bun ts/scripts/npm-admission.ts"
"release:npm-archive" = "cd {repo} && bun ts/scripts/npm-archive.ts"
"release:npm-certificate" = [
  { task = "release:npm-admission" },
  { task = "release:npm-archive" },
]
"check:release-candidate" = "cd {repo} && bun ts/scripts/verify-npm-candidate.ts"
"check:release-automation" = "cd {repo} && bun ts/scripts/check-release-automation.ts"
check = "cd {repo} && bun x svelte-check --tsconfig ts/tsconfig.json"
"check:types" = "cd {repo} && bun x tsc --project ts/tsconfig.json --noEmit"
"check:exports" = "cd {repo} && bun ts/scripts/check-exports.ts"
"check:boundaries" = "cd {repo} && bun ts/scripts/check-boundaries.ts"
"check:colour-literals" = "cd {repo} && bun ts/scripts/check-colour-literals.ts"
"check:pack" = "cd {repo} && bun ts/scripts/check-pack.ts"
"check:schemas" = "cd {repo} && bun ts/scripts/check-schemas.ts"
"check:version-sync" = "cd {repo} && bun ts/scripts/check-version-sync.ts"
"check:rust:format" = "cd {repo} && cargo fmt --all --check"
"check:rust" = "cd {repo} && cargo check --workspace --all-targets --locked"
"check:rust:clippy" = "cd {repo} && cargo clippy --workspace --all-targets --locked -- -D warnings"
"check:rust:package" = "cd {repo} && bun ts/scripts/check-rust-package.ts"
"check:git-consumer:npm" = "cd {repo} && bun ts/scripts/check-git-consumer.ts npm"
"check:git-consumer:cargo" = "cd {repo} && bun ts/scripts/check-git-consumer.ts cargo"
"check:format" = "cd {repo} && git diff --check"
"test:unit" = "cd {repo} && bun ts/scripts/run-test-files.ts ts/tests/nightfire ts/tests/wire"
"test:components" = "cd {repo} && NIGHTFIRE_COMPONENT_TESTS=1 bun ts/scripts/run-test-files.ts ts/tests/components ts/tests/patterns"
"test:sanitization" = "cd {repo} && bun ts/scripts/check-sanitization.ts"
"test:rust" = "cd {repo} && cargo test --workspace --locked"
"qa:docs:paths" = "cd {repo} && effigy docs check paths README.md AGENTS.md CLAUDE.md CHANGELOG.md CONTRIBUTING.md SECURITY.md PAPERCUTS.md PROVENANCE.md .agents.local.env.example ts/scripts/README.md docs/README.md docs/plan.md docs/triage/README.md docs/knowledge/README.md docs/knowledge/vision.md docs/knowledge/architecture.md docs/knowledge/questions.md docs/knowledge/contracts/README.md docs/knowledge/contracts/working-rules.md docs/knowledge/contracts/package-boundary.md docs/knowledge/contracts/styling.md docs/knowledge/contracts/review-oracle.md docs/knowledge/contracts/release.md docs/knowledge/contracts/writing-style.md docs/knowledge/domain/README.md docs/knowledge/domain/vocabulary.md fixtures/wire/v1/README.md rust/nightfire/README.md"
"qa:docs:links" = "cd {repo} && effigy docs check links README.md CONTRIBUTING.md SECURITY.md PAPERCUTS.md PROVENANCE.md ts/scripts/README.md docs/README.md docs/plan.md docs/triage/README.md docs/knowledge/README.md docs/knowledge/vision.md docs/knowledge/architecture.md docs/knowledge/questions.md docs/knowledge/contracts/README.md docs/knowledge/contracts/working-rules.md docs/knowledge/contracts/package-boundary.md docs/knowledge/contracts/styling.md docs/knowledge/contracts/review-oracle.md docs/knowledge/contracts/release.md docs/knowledge/contracts/writing-style.md docs/knowledge/domain/README.md docs/knowledge/domain/vocabulary.md fixtures/wire/v1/README.md rust/nightfire/README.md"
"qa:docs:agent-defaults" = "cd {repo} && effigy docs check forbidden AGENTS.md README.md docs/README.md --forbid '--repo .'"
"qa:docs:knowledge:local-paths" = "cd {repo} && effigy docs check forbidden docs/knowledge/*.md docs/knowledge/*/*.md docs/plan.md --forbid '/Users/' --forbid '/home/'"
"qa:docs" = [
  { task = "qa:docs:paths" },
  { task = "qa:docs:links" },
  { task = "qa:docs:agent-defaults" },
  { task = "qa:docs:knowledge:local-paths" },
]

"qa:northstar:agent-contract" = "cd {repo} && effigy docs check contains AGENTS.md --require 'effigy tasks' --require 'effigy test --plan' --require 'effigy qa' --require 'docs/README.md' --require 'docs/knowledge/README.md' --require 'docs/plan.md'"
"qa:northstar:front-door" = "cd {repo} && effigy docs check contains docs/README.md --require 'knowledge/README.md' --require 'plan.md'"
"qa:northstar" = [
  { task = "qa:northstar:agent-contract" },
  { task = "qa:northstar:front-door" },
]

health = [
  { task = "check:exports" },
  { task = "check:boundaries" },
  { task = "check:schemas" },
  { task = "check:colour-literals" },
  { task = "check:version-sync" },
]

validate = [
  { task = "health" },
  { task = "check" },
  { task = "check:types" },
  { task = "check:rust:format" },
  { task = "check:rust" },
  { task = "check:rust:clippy" },
  { task = "test:unit" },
  { task = "test:components" },
  { task = "test:rust" },
]

qa = [
  { task = "validate" },
  { task = "test:sanitization" },
  { task = "check:pack" },
  { task = "check:rust:package" },
  { task = "check:git-consumer:npm" },
  { task = "check:git-consumer:cargo" },
  { task = "qa:docs" },
  { task = "qa:northstar" },
  { task = "check:format" },
  { task = "check:release-automation" },
]

[test.suites]
unit = "bun ts/scripts/run-test-files.ts ts/tests/nightfire ts/tests/wire"
components = "NIGHTFIRE_COMPONENT_TESTS=1 bun ts/scripts/run-test-files.ts ts/tests/components ts/tests/patterns"
sanitization = "bun ts/scripts/check-sanitization.ts"
rust = "cargo test --workspace --locked"

[scan.attention_markers]
warning = ["TODO", "REVIEW", "placeholder"]
high = ["FIXME", "HACK", "workaround", "tech debt"]
critical = ["BUG:", "SECURITY:", "remove before release"]
doctor = true
fail_on_findings = false
respect_gitignore = true
