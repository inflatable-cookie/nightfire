[workspace]
members = ["rust/nightfire"]
resolver = "2"

[workspace.package]
version = "0.1.0"
rust-version = "1.95"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v7"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
