name: CI

# Release gate. Every check the repository owns is reachable through `effigy qa`,
# which composes `validate` (health, svelte-check, tsc, cargo fmt/check/clippy,
# unit/component/rust tests), the sanitization test, the packaging proofs, the
# cross-language consumer proofs, and the docs gates. CI calls that surface
# rather than restating it, so local and CI cannot drift apart.
#
# `effigy bootstrap:deps` must run before the gate: the gate reads the installed
# dependency tree, and a stale `node_modules` fails `svelte-check` with errors
# that look like source defects (an older poodle-svelte that lacks a subpath
# export, for instance). Installing first makes the gate's verdict about the code.

on:
  # A manual trigger so the gate can be run on demand, and so the first run
  # after enabling Actions is observable without an empty push.
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Expose origin/main for any changed-range logic that needs a visible base.
      - run: git fetch --no-tags origin main:refs/remotes/origin/main

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      # The workspace pins rust-version = 1.95; the components are needed by the
      # fmt and clippy gates inside `effigy qa`.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # Rust 1.95
        with:
          toolchain: "1.95"
          components: rustfmt, clippy

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      # Effigy runs the repository's own tasks; the version must satisfy
      # `minimum_effigy_version` in effigy.toml.
      - uses: inflatable-cookie/setup-effigy@987fd556617ea2c3e0ab5cef6b47b250817f50c8 # v1.0.0
        with:
          version: "0.12.1"

      - name: Install dependencies
        run: effigy bootstrap:deps

      - name: Repository health
        run: effigy health

      - name: Release gate
        run: effigy qa
